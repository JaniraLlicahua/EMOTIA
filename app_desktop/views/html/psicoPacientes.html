<!app_desktop\views\html\psicoPacientes.html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Psicólogo</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/psicoPStyles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Checkbox oculto para activar el menú -->
  <input type="checkbox" id="menu-toggle" />

  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2><span>PANEL</span><br>PSICÓLOGO</h2>
      <nav>
        <ul>
          <a class="active" href="psicoPacientes.html"><i class="fa-solid fa-users"></i> Lista de Pacientes</a>
          <a href="psicoEmociones.html"><i class="fa-regular fa-heart"></i> Centro de Emociones</a>
          <a href="psicoChat.html"><i class="fa-regular fa-comments"></i> Chat</a>
          <a href="psicoReuniones.html"><i class="fa-regular fa-calendar-check"></i> Reuniones</a>
        </ul>
      </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
      <header class="header">
        <!-- Botón hamburguesa -->
        <label for="menu-toggle" class="menu-btn"><i class="fa-solid fa-bars"></i></label>

        <div class="breadcrumb">
          <span class="current">Lista de Pacientes</span>
        </div>

        <div class="header-right">

          <div class="user">
            <img src="../pictures/user.png" alt="Usuario" class="avatar" title="img user" />
            <span class="username" title="usuario">Derek Alvarado</span>
            <i class="fa-solid fa-caret-down small" title="ver más"></i>
          </div>
        </div>
      </header>

      <!-- Contenido -->
      <section class="content">
        <div class="content-header">
          <h1>Lista de Pacientes</h1>
        </div>

        <div class="table-container">
          <div class="table-actions">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="searchInput" placeholder="Buscar paciente por nombre o apellido..." />
            </div>
          </div>

          <table id="patientsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre Completo</th>
                <th>Estado</th>
                <th>Correo</th>
                <th>Fecha de Nacimiento</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="patientsBody">
              <!-- Se llenará dinámicamente desde psicoPacientes.js -->
            </tbody>
          </table>

          <div class="pagination" id="pagination"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Conexión PyQt5 -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="../js/psicoPacientes.js"></script>

  <!-- Modal de perfil del paciente -->
  <div id="profileModal" class="modal">
    <div class="modal-content"></div>
  </div>
</body>
</html>
