#app_desktop\views\html\room_psico.html
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emotia — Sala Psicólogo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/psicoRoStyles.css">
</head>

<body>
<div class="topbar">
    <h2>👩‍⚕️ EMOTIA — Sesión Psicólogo</h2>
    <div id="sessionInfo">Sesión #: —</div>
</div>

<div class="layout">
    <div class="call-area">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>

        <div class="controls">
            <button id="btnCam" title="Activar/Desactivar cámara"><i class="fa-solid fa-video"></i></button>
            <button id="btnMic" title="Activar/Desactivar micrófono"><i class="fa-solid fa-microphone"></i></button>
            <!-- botón de reporte eliminado (guardado automático) -->
            <button id="btnHangup" class="danger" title="Finalizar"><i class="fa-solid fa-phone-slash"></i></button>
        </div>

        <!-- overlay de alerta (oculto por defecto) -->
        <div id="alertOverlay" class="alert-overlay" style="display:none;">
            <div class="alert-box">⚠️ Atención: emoción persistente detectada</div>
        </div>
    </div>

    <aside class="panel">
        <h3>Panel de Emociones</h3>
        <canvas id="emotionChart"></canvas>
        <div id="emotionCounts" style="font-size:13px;color:#444;margin-top:8px;"></div>

        <h3>📝 Notas del Psicólogo</h3>
        <textarea id="notes" placeholder="Escribe tus observaciones aquí..."></textarea>
    </aside>
</div>

<div id="reportModal" class="report-modal" style="display:none;">
    <div class="report-box">
        <h3>🧾 Reporte Clínico Completo</h3>

        <label>Motivo de consulta</label>
        <textarea id="r_motivo"></textarea>

        <label>Antecedentes</label>
        <textarea id="r_antecedentes"></textarea>

        <label>Evolución</label>
        <textarea id="r_evolucion"></textarea>

        <label>Estado de ánimo</label>
        <input id="r_estado">

        <label>Afecto</label>
        <input id="r_afecto">

        <label>Conducta</label>
        <input id="r_conducta">

        <label>Insight</label>
        <input id="r_insight">

        <label>Pruebas aplicadas</label>
        <textarea id="r_pruebas"></textarea>

        <label>Temas tratados</label>
        <textarea id="r_temas"></textarea>

        <label>Técnicas aplicadas</label>
        <textarea id="r_tecnicas"></textarea>

        <label>Actividades</label>
        <textarea id="r_actividades"></textarea>

        <label>Análisis clínico</label>
        <textarea id="r_analisis"></textarea>

        <label><input type="checkbox" id="r_riesgo_suicida"> Riesgo suicida</label>
        <label><input type="checkbox" id="r_riesgo_autolesion"> Autolesión</label>
        <label><input type="checkbox" id="r_riesgo_otros"> Riesgo a otros</label>

        <label>Objetivos</label>
        <textarea id="r_objetivos"></textarea>

        <label>Tareas</label>
        <textarea id="r_tareas"></textarea>

        <label>Ajustes del tratamiento</label>
        <textarea id="r_ajustes"></textarea>

        <label>Pronóstico</label>
        <textarea id="r_pronostico"></textarea>

        <label>Próxima sesión</label>
        <input type="date" id="r_proxima_sesion">

        <label>Recomendaciones</label>
        <textarea id="r_recomendaciones"></textarea>

        <label>Notas adicionales</label>
        <textarea id="r_notas_adicionales"></textarea>

        <label>Psicólogo</label>
        <input id="r_profesional" readonly>

        <label>Licencia</label>
        <input id="r_licencia" readonly>

        <div class="report-actions">
        <button id="btnGuardarReporte">Guardar Reporte</button>
        <button id="btnCancelarReporte">Cancelar</button>
        </div>
    </div>
</div>

<div class="footer">Emotia — Videollamada con IA de Emociones</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/room_psico.js"></script>
</body>
</html>
