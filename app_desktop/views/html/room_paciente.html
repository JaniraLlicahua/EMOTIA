<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emotia — Sala Paciente</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/pacieRoStyles.css">
</head>

<body>

    <div class="topbar">
        <h2>🧑‍🦰 EMOTIA — Sesión Paciente</h2>
    </div>

    <div class="call-area">
        <!-- Video remoto pantalla completa -->
        <video id="remoteVideo" autoplay playsinline></video>

        <!-- Video local flotante -->
        <video id="localVideo" autoplay muted playsinline></video>

        <!-- Controles redondos -->
        <div class="controls">
            <button id="btnCam" title="Activar/Desactivar cámara"><i class="fa-solid fa-video"></i></button>
            <button id="btnMic" title="Activar/Desactivar micrófono"><i class="fa-solid fa-microphone"></i></button>
            <button id="btnExit" class="danger" title="Salir"><i class="fa-solid fa-phone-slash"></i></button>
        </div>
    </div>

    <div class="footer">Emotia — Videollamada con IA de Emociones</div>

    <script src="../js/room_paciente.js"></script>
</body>
</html>
