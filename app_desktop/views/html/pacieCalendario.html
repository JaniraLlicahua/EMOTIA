<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Calendario - Panel Paciente</title>

  <link rel="stylesheet" href="../css/pacieRStyles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />

</head>
<body>

  <input type="checkbox" id="menu-toggle" />

  <div class="container">

    <!-- ======================
        SIDEBAR PACIENTE
    ======================= -->
    <aside class="sidebar">
      <h2 class="logo">PANEL<br>PACIENTE</h2>

      <nav>
        <ul>
          <a class="active" href="pacieCalendario.html">
            <i class="fa-regular fa-calendar-check"></i> Mis Sesiones
          </a>

          <a href="pacieChat.html">
            <i class="fa-regular fa-comments"></i> Chat
          </a>
        </ul>
      </nav>
    </aside>

    <!-- ======================
        CONTENIDO PRINCIPAL
    ======================= -->
    <main class="main-content">

      <!-- Header -->
      <header class="header">

        <label for="menu-toggle" class="menu-btn">
          <i class="fa-solid fa-bars"></i>
        </label>

        <div class="breadcrumb">
          <span class="current">Mis Sesiones</span>
        </div>

        <div class="header-right">
          <button class="icon-btn" title="Notificaciones">
            <i class="fa-regular fa-bell"></i>
          </button>
          <button class="icon-btn" title="Mensajes">
            <i class="fa-regular fa-envelope"></i>
          </button>

          <div class="user">
            <img src="../pictures/user.png" alt="Usuario" class="avatar">
            <span class="username" id="patientName">Paciente</span>
            <i class="fa-solid fa-caret-down"></i>
          </div>
        </div>

      </header>

      <!-- ======================
          CALENDARIO (IGUAL A PSICO)
      ======================= -->
      <section class="calendar-section">

        <div class="calendar-header">
          <button class="nav-btn" id="btnPrev"><i class="fa-solid fa-chevron-left"></i></button>
          <h3 id="weekTitle">Semana actual</h3>
          <button class="nav-btn" id="btnNext"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="calendar">

          <div class="calendar-grid" id="sessionsContainer">
            <!-- Las sesiones se insertan aquí -->
          </div>
        </div>

        <aside class="details" id="detailsPanel">
          <h3>Detalles de la Sesión</h3>
          <p><strong>Psicólogo:</strong> <span id="detPsicologo">-</span></p>
          <p><strong>Fecha:</strong> <span id="detFecha">-</span></p>
          <p><strong>Hora:</strong> <span id="detHora">-</span></p>
          <p><strong>Tema:</strong> <span id="detTema">-</span></p>
          <p><strong>Duración:</strong> <span id="detDuracion">1 hora</span></p>
          <button class="btn-join" id="btnUnirse">Unirse a la Reunión</button>
        </aside>

      </section>

    </main>

  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="../js/pacieCalendario.js"></script>

</body>
</html>
